name: projeto_dbt
version: "1.0"
config-version: 2

profile: projeto_dbt  # O mesmo nome do profile no profiles.yml

model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  projeto_dbt:
    +schema: main  # Certifique-se de que "main" está correto e não "dev"
    silver:
      +materialized: table